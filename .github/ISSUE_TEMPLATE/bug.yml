name: Ошибка программы или выпуска
description: Сбой сборщика, API или еженедельного релиза
title: 'bug: '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версия или ссылка на запуск Actions
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Как воспроизвести
      description: Команда, ожидаемый и фактический результат. Не прикладывайте секреты.
    validations:
      required: true
