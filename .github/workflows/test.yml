name: Test

on:
  push:
    branches: [main]
    # Documentation and images cannot break a script, manifest or config:
    # a change made only of these files skips validation entirely.
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.adoc'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.odt'
      - '**.rtf'
      - '**.ppt'
      - '**.pptx'
      - '**.odp'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.ico'
      - '**.svg'
  pull_request:
    # Documentation and images cannot break a script, manifest or config:
    # a change made only of these files skips validation entirely.
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.adoc'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - '**.odt'
      - '**.rtf'
      - '**.ppt'
      - '**.pptx'
      - '**.odp'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.webp'
      - '**.avif'
      - '**.bmp'
      - '**.tif'
      - '**.tiff'
      - '**.ico'
      - '**.svg'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: pwsh -NoProfile -File ./test/powershell-wrapper.test.ps1
      - run: npm run build:api
      - run: npm run validate:api
      - run: node collect-rf-equivalent-domains.mjs --help
