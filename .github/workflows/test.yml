name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: pwsh -NoProfile -File ./test/powershell-wrapper.test.ps1
      - run: npm run build:api
      - run: npm run validate:api
      - run: node collect-rf-equivalent-domains.mjs --help
      - name: Diagnose scanner connectivity
        if: github.head_ref == 'fix/scanner-destination-limits'
        env:
          UV_THREADPOOL_SIZE: 64
        run: |
          node collect-rf-equivalent-domains.mjs --source majestic --limit 500 --concurrency 400 --refresh --out .local/network-probe
          node --input-type=module -e "import fs from 'node:fs'; const e=JSON.parse(fs.readFileSync('.local/network-probe/evidence.json')); console.log(JSON.stringify({statistics:e.statistics,errors:e.fetchErrors,catalogErrors:e.catalogErrors},null,2));"
